<!DOCTYPE html>
<!-- S-2 · Knowledge base. Add, inspect and delete the documents the bot knows. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Knowledge base — RAG Chatbot POC</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Knowledge base</h1>
    <nav><a class="button" href="/">&larr; Chat</a></nav>
  </header>

  <main>
    <div id="notice" class="notice hidden"></div>

    <section class="card">
      <h2>Add a document</h2>
      <form id="add-form">
        <div class="field">
          <label for="title">Title</label>
          <input type="text" id="title" required placeholder="Returns Policy">
        </div>

        <div class="field">
          <label for="source">Source <span class="muted">(optional)</span></label>
          <input type="text" id="source" placeholder="handbook p.12">
        </div>

        <div class="field">
          <label for="content">Content</label>
          <textarea id="content" required placeholder="Paste the document text here…"></textarea>
        </div>

        <div class="form-footer">
          <!-- Updated live by admin.js using the SAME chunker the server runs,
               so you can see how your text will be split before committing. -->
          <span class="estimate" id="estimate">0 characters</span>
          <button type="submit" id="submit" class="primary">Add to knowledge base</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2 id="docs-heading">Documents</h2>
      <div id="docs" class="small muted">Loading documents…</div>
    </section>
  </main>

  <script type="module" src="admin.js"></script>
</body>
</html>
